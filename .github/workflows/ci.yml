name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  firestore:
    # Security rules + server transactions against the Firestore emulator
    # (demo project: never touches production).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g firebase-tools@15
      - run: npm ci --prefix firebase/rules-test
      - run: dart pub get
      - run: >
          firebase emulators:exec --only firestore --project demo-parchis
          "npm --prefix firebase/rules-test test && dart test test/integration"

  docker:
    # The production image builds, starts, and carries no credentials.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Plant a fake credential that must not end up in the image
        run: echo '{"canary":true}' > service_account.json
      - run: docker build -t parchis-server .
      - name: Image contains no service account
        run: |
          docker create --name probe parchis-server
          if docker export probe | tar -t | grep -i service_account; then
            echo "service_account.json leaked into the image"; exit 1
          fi
      - name: Container serves /health
        run: |
          docker run -d -p 8080:8080 -e PARCHIS_DEV_AUTH_BYPASS=true --name srv parchis-server
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && exit 0
            sleep 1
          done
          docker logs srv
          exit 1

  stress:
    # Concurrent rooms + hostile clients + leak check against a real server.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5
      - run: dart pub get
      - run: dart pub global activate dart_frog_cli
      - run: dart pub global run dart_frog_cli:dart_frog build
      - name: Start server (no Firebase credentials, test mode allowed)
        working-directory: build
        run: |
          dart pub get
          PARCHIS_DEV_AUTH_BYPASS=true PARCHIS_ALLOW_TEST_MODE=true \
            dart bin/server.dart > ../server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && exit 0
            sleep 1
          done
          cat ../server.log
          exit 1
      - run: dart run tool/stress_test.dart ws://localhost:8080/ws 4 --quick
      - name: Server log
        if: always()
        run: cat server.log
